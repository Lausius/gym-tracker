name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-tjek af app.js
        run: node --check app.js

      - name: Logik-tests (A/B-rotation, program-integritet, progressiv overload)
        run: node tests/run-tests.js