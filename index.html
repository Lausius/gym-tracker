<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Gym Tracker – Track your training with an upper/lower split">
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div class="header-icon">🏋️</div>
                <div>
                    <div class="header-title">Gym Tracker</div>
                    <div class="header-subtitle">Upper / Lower Split</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn share-btn" id="btn-share" title="Share training data with your coach">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    Share
                </button>
                <button class="icon-btn" id="btn-notes" title="Weekly coach notes" aria-label="Coach notes">
                    📝
                </button>
                <button class="icon-btn" id="btn-history" title="Show history" aria-label="History">
                    📋
                </button>
            </div>
        </header>

        <!-- Eksempeldata (kun synlig når loggen er tom) -->
        <div class="sample-section hidden" id="sample-section">
            <div class="sample-title">🧪 Try the app with sample data</div>
            <p class="sample-note" id="sample-note"></p>
            <button class="sample-btn" id="sample-btn" type="button">Load sample data</button>
        </div>

        <!-- Share modal -->
        <div class="share-overlay hidden" id="share-overlay"></div>
        <div class="share-modal hidden" id="share-modal">
            <div class="share-modal-header">
                <h2>📤 Share training data</h2>
                <button class="share-modal-close" id="share-modal-close">✕</button>
            </div>
            <div class="share-modal-body">
                <p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;">
                    Copy the text below and send it to me — then I can review your progress and give you personal advice.
                </p>
                <div class="share-scope-row">
                    <label for="share-scope">Show:</label>
                    <select id="share-scope"></select>
                </div>
                <textarea id="share-text" readonly></textarea>
                <div class="share-size" id="share-size"></div>
                <div class="share-modal-actions">
                    <button class="share-copy-btn" id="share-copy">📋 Copy</button>
                    <button class="share-close-btn" id="share-close">Cancel</button>
                </div>
            </div>
        </div>


        <!-- Dagens pas: navn, fokus og ugens fire pas. Felterne i ugebjælken ER
             valget af pas — en "Lower A" er både dagen og varianten. Øvelserne står
             kun nedenfor; de er allerede lagt ind. -->
        <div class="session-bar" id="session-bar">
            <div class="session-top">
                <div class="session-title">
                    <span class="session-label" id="session-label">Upper A</span>
                    <span class="session-focus" id="session-focus"></span>
                </div>
                <span class="variant-hint" id="variant-hint"></span>
            </div>
            <div class="week-strip" id="week-strip"></div>
            <div class="session-warning hidden" id="session-warning"></div>
            <div class="program-memory" id="program-memory"></div>
        </div>

        <!-- Exercises: dagens program, med sæt, vægt og reps -->
        <div class="section-header">
            <div class="section-title">
                Exercises
                <span class="count" id="exercise-count">0</span>
            </div>
            <span class="section-hint" id="exercise-hint"></span>
        </div>
        <div class="restore-row hidden" id="exercise-restore"></div>
        <div class="exercise-list" id="exercise-list"></div>
    </div>

    <!-- Save Bar -->
    <div class="save-bar" id="save-bar">
        <div class="edit-banner hidden" id="edit-banner">
            <span class="edit-banner-text" id="edit-banner-text"></span>
            <button class="edit-cancel-btn" id="edit-cancel">Cancel</button>
        </div>
        <div class="save-bar-row">
            <div class="save-info" id="save-info">
                No exercises added
            </div>
            <button class="save-btn" id="save-btn" disabled>
                💾 Save workout
            </button>
        </div>
        <!-- Vises kun når det tastede faktisk ligger gemt i browseren (se updateDraftNote) -->
        <div class="draft-note hidden" id="draft-note"></div>
    </div>

    <!-- History Panel -->
    <div class="history-overlay" id="history-overlay"></div>
    <div class="history-panel" id="history-panel">
        <div class="history-panel-header">
            <div class="history-panel-title">📋 Workout history</div>
            <button class="close-btn" id="close-history">✕</button>
        </div>
        <div class="history-content" id="history-content"></div>
    </div>

    <!-- Coach notes panel (hentes fra nettet, ikke fra localStorage) -->
    <div class="notes-overlay" id="notes-overlay"></div>
    <div class="notes-panel" id="notes-panel">
        <div class="notes-panel-header">
            <div class="notes-panel-title">📝 Coach notes</div>
            <button class="close-btn" id="close-notes" aria-label="Close coach notes">✕</button>
        </div>
        <div class="notes-content" id="notes-content"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
